pre-commit:
  jobs:
    - name: clang-format
      script: clang-format.sh

commit-msg:
  jobs:
    - name: cocogitto verify
      run: cog verify --file "{1}"   # {1} = commit-msg 的 message 文件路径 :contentReference[oaicite:2]{index=2}

pre-push:
  jobs:
    - name: clang-tidy
      run: bash clang-tidy.sh {push_files}